<!-- Ringer sign-in email: a 6-digit code to TYPE into the app. Deliberately no
     link: on iOS a link opens Safari, whose storage is separate from the
     installed home-screen app, so it would sign in the wrong place. -->
<h2>Your Ringer sign-in code</h2>
<p>Enter this code in Ringer to sign in:</p>
<p style="font-size: 28px; font-weight: bold; letter-spacing: 6px;">{{ .Token }}</p>
<p>It expires in an hour and works once. If you didn't try to sign in, you can ignore this email.</p>
